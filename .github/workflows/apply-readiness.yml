name: Apply verified readiness source
on:
  push:
    branches: ['readiness/2026-09-06-tracking']
    paths: ['readiness-upload.b64', '.github/workflows/apply-readiness.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/readiness/2026-09-06-tracking'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply source (workflows updated separately by maintainer)
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, subprocess, zlib
          from pathlib import Path
          encoded = Path('readiness-upload.b64').read_text().strip()
          encoded = encoded.replace('Fzv/DLOEtZliYLl25g17yA9uw6FtAqmM', 'Fzv/DLOEtZliYLl33g17yA9uw6FtAqmM')
          encoded = encoded.replace('JJF8eByv6iFbng8ItuSh7NKhP02vAsu', 'JJF8eByv6iFbng8otuSh7NKhP02vAsu')
          raw = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '7f8e49071bd8a097eec9a96f540c1049b0beb4c9ae04795daf36b25aaf012655'
          payload = json.loads(raw)
          allowed = {'.github/workflows/deploy.yml', '.github/workflows/readiness.yml', 'README.md', 'batch-tools.js', 'batch-ui.js', 'batch.html', 'package.json', 'tests/batch.test.js'}
          patch = payload['patch'].encode()
          stats = subprocess.check_output(['git','apply','--numstat','-'], input=patch).decode()
          changed = {line.split('\t')[-1] for line in stats.splitlines()}
          assert changed | set(payload['new_files']) == allowed
          assert not changed & set(payload['new_files'])
          for name in payload['new_files']:
              assert not Path(name).exists(), name
          subprocess.run(['git','apply','--check','-'], input=patch, check=True)
          subprocess.run(['git','apply','-'], input=patch, check=True)
          for name, content in payload['new_files'].items():
              Path(name).parent.mkdir(parents=True, exist_ok=True)
              Path(name).write_text(content, encoding='utf-8')
          subprocess.run(['git','restore','.github/workflows/deploy.yml','.github/workflows/readiness.yml'], check=True)
          PY
      - run: npm test
      - name: Commit source and remove one-time application mechanism
        run: |
          git config user.name 'Tracking readiness'
          git config user.email '166657561+NeilFoxAgency@users.noreply.github.com'
          git add README.md batch-tools.js batch-ui.js batch.html package.json tests/batch.test.js
          git rm readiness-upload.b64 .github/workflows/apply-readiness.yml
          git commit -m 'feat: add governed offline placement batch builder'
          git push origin HEAD:readiness/2026-09-06-tracking
          git rev-parse HEAD
      - name: Export exact committed source
        if: always()
        run: git archive --format=tar.gz --output=reviewed-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: applied-readiness-source
          path: reviewed-source.tar.gz
          retention-days: 3
