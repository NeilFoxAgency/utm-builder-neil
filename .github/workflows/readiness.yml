name: Tracking readiness
on:
  push:
    branches: ['readiness/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar.gz --output=reviewed-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-source-${{ github.sha }}
          path: reviewed-source.tar.gz
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
