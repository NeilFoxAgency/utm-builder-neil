<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Privacy-first UTM link builder for creator campaigns. Client-side only — no tracking, no server.">
  <title>UTM Builder — Neil Fox Agency</title>
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --text: #1a1a1a;
      --muted: #5c5c5c;
      --border: #d0d0d0;
      --primary: #0066cc;
      --primary-hover: #0052a3;
      --success: #1a7f37;
      --tip-bg: #e8f4fc;
      --tip-border: #0066cc;
      --history-bg: #f5f5f5;
      --focus: #0066cc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --surface: #1e1e1e;
        --text: #f0f0f0;
        --muted: #a0a0a0;
        --border: #404040;
        --primary: #4da3ff;
        --primary-hover: #7bb8ff;
        --success: #3fb950;
        --tip-bg: #0d2137;
        --tip-border: #4da3ff;
        --history-bg: #2a2a2a;
        --focus: #4da3ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 1.5rem;
      line-height: 1.55;
      background: var(--bg);
      color: var(--text);
    }
    a { color: var(--primary); }
    .skip { position: absolute; left: -9999px; }
  </style>
</head>
<body>
  <p>Restored placeholder — do not merge. Use feat/batch-placements-complete.</p>
</body>
</html>
